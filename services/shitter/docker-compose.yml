services:
  nitter:
    image: mv12star/shitter:latest
    container_name: shitter
    ports:
      - "0.0.0.0:6972:8080"
    volumes:
      - ./nitter.conf:/src/nitter.conf:Z,ro
      # Created from a burner Twitter login. See sessions.jsonl.example.
      # This file is gitignored — place it on the server manually, then deploy.
      - ./sessions.jsonl:/src/sessions.jsonl:Z,ro
      # Custom Nord theme (committed, public-safe). Nitter lists every file
      # in css/themes/ on /settings automatically, so this shows up as "Nord".
      - ./nord.css:/src/public/css/themes/nord.css:Z,ro
    depends_on:
      - nitter-redis
    restart: unless-stopped
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:8080/Jack/status/20 || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    user: "998:998"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nitter-redis:
    image: redis:6-alpine
    container_name: shitter-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - shitter-redis:/data
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 5s
      retries: 2
    user: "999:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  shitter-redis:
