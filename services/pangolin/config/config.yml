# https://docs.pangolin.net/
# REPLACE placeholders before first start.

gerbil:
    start_port: 51820
    base_endpoint: "pangolin.cyanistic.com"

app:
    dashboard_url: "https://pangolin.cyanistic.com"
    log_level: "info"
    telemetry:
        anonymous_usage: true

domains:
    domain1:
        base_domain: "cyanistic.com"

server:
    # secret comes from SERVER_SECRET (Infisical /pangolin), not this file
    cors:
        origins: ["https://pangolin.cyanistic.com"]
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        allowed_headers: ["X-CSRF-Token", "Content-Type"]
        credentials: false

flags:
    require_email_verification: false
    disable_signup_without_invite: true
    disable_user_create_org: false
    allow_raw_resources: true
