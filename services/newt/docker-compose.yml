# Tunnel client. Runs on every box that should serve apps.
# Create the site in the Pangolin UI first, then put NEWT_ID / NEWT_SECRET
# in Infisical folder /newt. Pangolin applies services/pangolin/blueprint.yaml.

services:
  newt:
    image: docker.io/fosrl/newt:latest
    container_name: newt
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:-https://pangolin.cyanistic.com}
      NEWT_ID: ${NEWT_ID}
      NEWT_SECRET: ${NEWT_SECRET}
      HEALTH_FILE: /tmp/healthy
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/healthy ]"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
