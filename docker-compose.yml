services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - 127.0.0.1:4000:4000
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - litellm-data:/data
      - litellm-tokens:/root/.litellm
    env_file: .env
    command:
      [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
        "--db",
        "sqlite:///data/litellm.db",
      ]
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:4000/health/readiness 2>/dev/null || curl -sf http://localhost:4000/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  litellm-data:
  litellm-tokens:
