name: model-hotel

services:
  app:
    # Builds natively for any platform (ARM, x86, etc.)
    build:
      context: https://github.com/hugalafutro/model-hotel.git
      args:
        VERSION: local
    # Prebuilt image (amd64 only — needs QEMU on ARM):
    # image: ghcr.io/hugalafutro/model-hotel:latest
    container_name: model-hotel
    labels:
      app.group: model-hotel
    ports:
      - 0.0.0.0:${HOST_PORT:-4006}:8080
    environment:
      # Security
      - CORS_ORIGINS=http://localhost:5173,http://localhost:${HOST_PORT:-4006}
      # Data
      - DATA_DIR=/data
    volumes:
      - ./.data:/data
    env_file:
      ./.env
    restart: unless-stopped
